name: DB Probe (one-off, read-only)

# Manual diagnostic: runs scripts/probe_trackflow.py on the runner (which can reach the
# firewalled RDS) to discover ng_log_trackflow's real schema. Read-only. Safe to delete
# after the schema is confirmed.
on:
  workflow_dispatch:
    inputs:
      order_id:
        description: "Order ID to probe (a known invoiced order)"
        required: false
        default: "1000285363"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST:     ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT:     ${{ secrets.MYSQL_PORT }}
      MYSQL_USER:     ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DB:       ${{ secrets.MYSQL_DB }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe ng_log_trackflow (read-only)
        run: python scripts/probe_trackflow.py "${{ github.event.inputs.order_id }}"
