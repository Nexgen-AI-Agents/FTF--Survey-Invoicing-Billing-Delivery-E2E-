name: Monthly Statements Loop

on:
  # Monthly auto-send PAUSED 2026-06-26 per user request — no automated customer
  # statement emails for now ("we'll see that later"). To resume, un-comment the
  # schedule below. Manual runs remain available via workflow_dispatch.
  # schedule:
  #   # GitHub fires cron in UTC only. 12:00 UTC = 08:00 ET (EDT) / 07:00 ET (EST).
  #   - cron: "0 12 1 * *"   # ~08:00 AM Eastern, 1st of every month
  workflow_dispatch:

jobs:
  run-statements-loop:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York   # run this job in Eastern Time (DST-aware)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Statements (Agent 15)
        env:
          FTF_API_KEY:          ${{ secrets.FTF_API_KEY }}
          DB_HOST:              ${{ secrets.DB_HOST }}
          DB_PORT:              ${{ secrets.DB_PORT }}
          DB_NAME:              ${{ secrets.DB_NAME }}
          DB_USER:              ${{ secrets.DB_USER }}
          DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
          STATEMENT_OUTPUT_DIR: /tmp/statements
        run: python code/sprint_08_monthly_statements/agents/agent_15_statement_generator.py

      - name: Review Statements (Agent 16)
        env:
          DB_HOST:              ${{ secrets.DB_HOST }}
          DB_PORT:              ${{ secrets.DB_PORT }}
          DB_NAME:              ${{ secrets.DB_NAME }}
          DB_USER:              ${{ secrets.DB_USER }}
          DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
          TEAMS_WEBHOOK_URL:    ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATEMENT_OUTPUT_DIR: /tmp/statements
        run: python code/sprint_08_monthly_statements/agents/agent_16_statement_reviewer.py

      - name: Send Statements (Agent 17)
        env:
          DB_HOST:              ${{ secrets.DB_HOST }}
          DB_PORT:              ${{ secrets.DB_PORT }}
          DB_NAME:              ${{ secrets.DB_NAME }}
          DB_USER:              ${{ secrets.DB_USER }}
          DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
          TEAMS_WEBHOOK_URL:    ${{ secrets.TEAMS_WEBHOOK_URL }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:            ${{ secrets.SMTP_FROM }}
          STATEMENT_OUTPUT_DIR: /tmp/statements
        run: python code/sprint_08_monthly_statements/agents/agent_17_statement_sender.py
